# !! WARNING: This is a PLACEHOLDER secret. !!
# In production, use Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets)
# or External Secrets Operator with a secrets manager (Vault, AWS SM, etc).
# NEVER commit real secrets to Git.
#
# To create a real secret for dev/testing:
#   kubectl create secret generic bloomlater-secrets \
#     --from-literal=JWT_ACCESS_SECRET=$(openssl rand -hex 64) \
#     --from-literal=JWT_REFRESH_SECRET=$(openssl rand -hex 64) \
#     --from-literal=MONGO_URI="mongodb://user:pass@mongo:27017/bloomlater?authSource=admin" \
#     --from-literal=MONGO_ROOT_PASSWORD="changeme" \
#     -n bloomlater-dev

apiVersion: v1
kind: Secret
metadata:
  name: bloomlater-secrets
  labels:
    app.kubernetes.io/name: bloomlater
type: Opaque
stringData:
  JWT_ACCESS_SECRET: "REPLACE_WITH_REAL_SECRET_64_BYTE_HEX"
  JWT_REFRESH_SECRET: "REPLACE_WITH_REAL_SECRET_64_BYTE_HEX"
  MONGO_URI: "mongodb://bloomlater:REPLACE_PASSWORD@mongo:27017/bloomlater?authSource=admin"
  MONGO_ROOT_PASSWORD: "REPLACE_WITH_REAL_PASSWORD"
