apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bloomlater-prod

resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml
  - argocd-app.yaml

namePrefix: prod-

images:
  - name: ghcr.io/your-org/bloomlater-frontend
    # This tag is automatically bumped by CI via kustomize edit set image
    newTag: "git-sha-placeholder"
  - name: ghcr.io/your-org/bloomlater-backend
    newTag: "git-sha-placeholder"

commonLabels:
  environment: prod
