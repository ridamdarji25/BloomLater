apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bloomlater-dev

resources:
  - ../../base

namePrefix: dev-

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: .*frontend.*
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: .*backend.*

images:
  - name: ghcr.io/your-org/bloomlater-frontend
    newTag: latest
  - name: ghcr.io/your-org/bloomlater-backend
    newTag: latest

commonLabels:
  environment: dev
